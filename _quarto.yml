format:
  html:
    theme: [darkly, shared/styles/theme.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    code-overflow: wrap
    html-math-method: mathjax
    link-external-icon: true
    fig-responsive: true
    css: shared/styles/custom.css
    include-in-header: shared/includes/pwa-head.html
    include-after-body: shared/scripts/reader-ui.html

execute:
  freeze: auto
