project:
  type: website
  output-dir: _site
  resources:
    - CNAME
    - favicon.ico
    - site.webmanifest
    - assets/icons/*
  render:
    - "*.qmd"
    - "navier-stokes/**/*.qmd"
    - "buffer-overflow/**/*.qmd"
    - "noncommutative-geometry/**/*.qmd"
    - "complex-geometry/**/*.qmd"
    - "rg-critical-phenomena/**/*.qmd"
    - "elliptic-curves-bsd/**/*.qmd"
    - "inverse-spectral-geometry/**/*.qmd"

website:
  title: "AI教科書ポータル"
  site-url: "https://textbooks.yohakostudio.com/"
  repo-url: "https://github.com/takahito-0398/textbooks"
  search:
    location: navbar
    type: overlay
  page-navigation: true
  navbar:
    background: primary
    right:
      - icon: github
        href: "https://github.com/takahito-0398/textbooks"
