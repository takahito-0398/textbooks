name: Deploy Quarto site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Validate sources
        run: |
          python scripts/validate_site.py
          python scripts/validate_gauge_authoring.py
          python -m unittest tests.test_gauge_authoring
          python scripts/sle_authoring.py validate
          python -m unittest tests.test_sle_authoring

      - name: Regenerate gauge-theory figures
        run: |
          python scripts/generate_gauge_figures.py
          git diff --exit-code -- gauge-theory-smooth-topology/assets/figures

      - name: Regenerate SLE figures
        run: |
          python scripts/generate_sle_figures.py
          git diff --exit-code -- sle-critical-phenomena/assets/figures

      - name: Render site
        run: quarto render

      - name: Verify gauge-theory PDF path
        run: python scripts/build_gauge_theory_pdf.py --check

      - name: Verify SLE PDF path
        run: python scripts/build_sle_pdf.py --check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
