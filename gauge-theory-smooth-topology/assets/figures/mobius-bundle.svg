<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">円筒束とメビウス束</title><desc id="desc">円周を一周したとき繊維の向きが保たれる円筒と、反転するメビウス帯を比較する。</desc><style>
text{font-family:system-ui,sans-serif;fill:#172033}.box{fill:#f8fafc;stroke:#475569;stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}.line{fill:none;stroke:#475569;stroke-width:3}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.box{fill:#1e293b;stroke:#cbd5e1}.blue{fill:#172554;stroke:#60a5fa}.red{fill:#450a0a;stroke:#f87171}.green{fill:#052e16;stroke:#4ade80}.line,.dash{stroke:#cbd5e1}}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect class="blue" x="70" y="95" width="340" height="230" rx="95"/><path class="dash" d="M105 210 H375"/><path class="line" d="M145 255 V150" marker-end="url(#a)"/><path class="line" d="M335 255 V150" marker-end="url(#a)"/><text class="title" x="240" y="70" text-anchor="middle">円筒</text><text class="small" x="240" y="365" text-anchor="middle">一周後も繊維の正方向は同じ</text><path class="red" d="M550 125 C645 55 835 80 865 185 C895 295 705 360 590 295 C520 255 515 170 550 125 Z"/><path class="dash" d="M565 205 C650 130 800 145 850 225"/><path class="line" d="M610 260 L650 155" marker-end="url(#a)"/><path class="line" d="M805 170 L765 280" marker-end="url(#a)"/><text class="title" x="720" y="70" text-anchor="middle">メビウス帯</text><text class="small" x="720" y="365" text-anchor="middle">一周後に繊維の正方向が反転</text></svg>