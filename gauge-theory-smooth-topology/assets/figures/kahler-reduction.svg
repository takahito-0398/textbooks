<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="title desc"><title id="title">Kähler reduction of Seiberg-Witten equations</title><desc id="desc">On a Kähler surface, spinors and curvature split into complex-geometric pieces.</desc><style>
text{font-family:system-ui,sans-serif;fill:#172033}.box{fill:#f8fafc;stroke:#475569;stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}.line{fill:none;stroke:#475569;stroke-width:3}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.box{fill:#1e293b;stroke:#cbd5e1}.blue{fill:#172554;stroke:#60a5fa}.red{fill:#450a0a;stroke:#f87171}.green{fill:#052e16;stroke:#4ade80}.line,.dash{stroke:#cbd5e1}}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect class="blue" x="55" y="55" width="285" height="120" rx="22"/><text class="title" x="198" y="98" text-anchor="middle">spinor Φ</text><text class="small" x="198" y="132" text-anchor="middle">W⁺ ≅ Λ⁰,⁰ ⊕ Λ⁰,²</text><rect class="red" x="640" y="55" width="285" height="120" rx="22"/><text class="title" x="782" y="98" text-anchor="middle">curvature F_A</text><text class="small" x="782" y="132" text-anchor="middle">(2,0), (1,1), (0,2)</text><rect class="green" x="220" y="255" width="540" height="145" rx="28"/><text class="title" x="490" y="300" text-anchor="middle">complex-geometric equations</text><text class="label" x="490" y="338" text-anchor="middle">∂̄_A α = 0,  β = 0  or the opposite chamber</text><text class="small" x="490" y="372" text-anchor="middle">spinor zero set becomes divisor data</text><path class="line" d="M210 185 C260 235 300 260 345 292" marker-end="url(#a)"/><path class="line" d="M770 185 C720 235 680 260 635 292" marker-end="url(#a)"/><text class="small" x="490" y="455" text-anchor="middle">PDE moduli descends to holomorphic sections and divisors</text></svg>