<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="title desc"><title id="title">Taubes large perturbation limit</title><desc id="desc">Large-perturbation Seiberg-Witten solutions concentrate near spinor zeros and yield pseudo-holomorphic curves.</desc><style>
text{font-family:system-ui,sans-serif;fill:#172033}.box{fill:#f8fafc;stroke:#475569;stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}.line{fill:none;stroke:#475569;stroke-width:3}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.box{fill:#1e293b;stroke:#cbd5e1}.blue{fill:#172554;stroke:#60a5fa}.red{fill:#450a0a;stroke:#f87171}.green{fill:#052e16;stroke:#4ade80}.line,.dash{stroke:#cbd5e1}}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect class="blue" x="40" y="80" width="230" height="120" rx="22"/><text class="title" x="155" y="123" text-anchor="middle">large r SW</text><text class="small" x="155" y="157" text-anchor="middle">perturbed solutions</text><rect class="red" x="375" y="80" width="230" height="120" rx="22"/><text class="title" x="490" y="123" text-anchor="middle">zero set</text><text class="small" x="490" y="157" text-anchor="middle">curvature concentrates</text><rect class="green" x="710" y="80" width="230" height="120" rx="22"/><text class="title" x="825" y="123" text-anchor="middle">J-curve</text><text class="small" x="825" y="157" text-anchor="middle">pseudo-holomorphic limit</text><path class="line" d="M275 140 H365" marker-end="url(#a)"/><path class="line" d="M610 140 H700" marker-end="url(#a)"/><path class="dash" d="M155 260 C280 360 700 360 825 260"/><text class="small" x="490" y="335" text-anchor="middle">compactness + positivity of intersections identify the limit</text><text class="label" x="490" y="415" text-anchor="middle">SW nonzero ⇒ geometric curve data</text></svg>