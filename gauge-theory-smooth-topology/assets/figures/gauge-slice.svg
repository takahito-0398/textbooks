<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Gauge orbit and Coulomb slice</title><desc id="desc">Nearby gauge orbits cross a local Coulomb slice transversely.</desc><style>
text{font-family:system-ui,sans-serif;fill:#172033}.box{fill:#f8fafc;stroke:#475569;stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}.line{fill:none;stroke:#475569;stroke-width:3}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.box{fill:#1e293b;stroke:#cbd5e1}.blue{fill:#172554;stroke:#60a5fa}.red{fill:#450a0a;stroke:#f87171}.green{fill:#052e16;stroke:#4ade80}.line,.dash{stroke:#cbd5e1}}</style><path class="blue" d="M85 120 C250 30 650 30 815 120 C650 210 250 210 85 120 Z"/><path class="blue" d="M85 255 C250 165 650 165 815 255 C650 345 250 345 85 255 Z"/><path class="blue" d="M85 390 C250 300 650 300 815 390"/><path class="red" d="M450 35 C390 120 510 205 450 295 C420 340 430 375 455 410"/><circle cx="450" cy="120" r="8" fill="#172033"/><circle cx="450" cy="255" r="8" fill="#172033"/><text class="label" x="160" y="90">gauge orbit</text><text class="label" x="515" y="205">Coulomb slice d*A a = 0</text><text class="small" x="450" y="418" text-anchor="middle">local representative, not a global choice</text></svg>