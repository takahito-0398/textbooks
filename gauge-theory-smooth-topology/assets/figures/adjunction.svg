<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-labelledby="title desc"><title id="title">随伴不等式</title><desc id="desc">基本類と曲面類が種数の下界を与える。</desc><style>
text{font-family:system-ui,sans-serif;fill:#172033}.box{fill:#f8fafc;stroke:#475569;stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}.line{fill:none;stroke:#475569;stroke-width:3}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.box{fill:#1e293b;stroke:#cbd5e1}.blue{fill:#172554;stroke:#60a5fa}.red{fill:#450a0a;stroke:#f87171}.green{fill:#052e16;stroke:#4ade80}.line,.dash{stroke:#cbd5e1}}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect class="blue" x="55" y="62" width="250" height="120" rx="22"/><text class="title" x="180" y="105" text-anchor="middle">曲面 Σ</text><text class="small" x="180" y="137" text-anchor="middle">種数 g、自己交点 Σ²</text><rect class="red" x="675" y="62" width="250" height="120" rx="22"/><text class="title" x="800" y="105" text-anchor="middle">基本類 K</text><text class="small" x="800" y="137" text-anchor="middle">非零のSW不変量から得る</text><rect class="green" x="245" y="250" width="490" height="135" rx="28"/><text class="title" x="490" y="295" text-anchor="middle">種数の下界</text><text class="label" x="490" y="337" text-anchor="middle">2g(Σ)-2 ≥ Σ² + |K·Σ|</text><path class="line" d="M190 190 C245 242 300 265 345 300" marker-end="url(#a)"/><path class="line" d="M790 190 C735 242 680 265 635 300" marker-end="url(#a)"/><path class="dash" d="M305 122 H675"/><text class="small" x="490" y="112" text-anchor="middle">組 K·Σ は基本類が曲面をどう捉えるかを測る</text><text class="small" x="490" y="425" text-anchor="middle">ゲージ理論が埋め込み曲面へ具体的な制約を返す</text></svg>