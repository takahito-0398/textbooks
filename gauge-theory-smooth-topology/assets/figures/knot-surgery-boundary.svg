<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
<title id="title">結び目手術の境界3トーラス</title>
<desc id="desc">トーラス近傍の法線円周を、結び目補空間側の標準ロンジチュードへ対応させる貼り合わせを示す。</desc>
<style>
text{font-family:system-ui,sans-serif;fill:#172033}.box{fill:#f8fafc;stroke:#475569;stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}.line{fill:none;stroke:#475569;stroke-width:3}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.box{fill:#1e293b;stroke:#cbd5e1}.blue{fill:#172554;stroke:#60a5fa}.red{fill:#450a0a;stroke:#f87171}.green{fill:#052e16;stroke:#4ade80}.line,.dash{stroke:#cbd5e1}}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect class="blue" x="45" y="70" width="360" height="170" rx="24"/>
<text class="title" x="225" y="112" text-anchor="middle">T の近傍を除く側</text>
<text class="label" x="225" y="154" text-anchor="middle">∂(T²×D²)=T³</text>
<text class="small" x="225" y="190" text-anchor="middle">T の二方向 + 法線円周 μ_T</text>
<ellipse class="dash" cx="225" cy="300" rx="145" ry="52"/>
<path class="line" d="M95 300 C145 246 305 246 355 300"/>
<text class="label" x="225" y="365" text-anchor="middle">μ_T</text>
<rect class="red" x="575" y="70" width="360" height="170" rx="24"/>
<text class="title" x="755" y="112" text-anchor="middle">S¹×(S³＼νK) 側</text>
<text class="label" x="755" y="154" text-anchor="middle">S¹ × ∂νK = T³</text>
<text class="small" x="755" y="190" text-anchor="middle">余分な S¹、メリディアン μ_K、ロンジチュード λ_K</text>
<ellipse class="dash" cx="755" cy="300" rx="145" ry="52"/>
<path class="line" d="M625 300 C675 246 835 246 885 300"/>
<text class="label" x="755" y="365" text-anchor="middle">λ_K</text>
<path class="line" d="M375 330 C470 405 510 405 605 330" marker-end="url(#a)"/>
<text class="title" x="490" y="445" text-anchor="middle">正しい対応: μ_T ↦ λ_K</text>
<text class="small" x="490" y="480" text-anchor="middle">μ_T を μ_K へ送ると標準的なFintushel-Stern結び目手術ではない</text>
</svg>
