<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc"><title id="title">Hodge decomposition</title><desc id="desc">Two-forms split into three-dimensional self-dual and anti-self-dual eigenspaces.</desc><style>
text{font-family:system-ui,sans-serif;fill:#172033}.box{fill:#f8fafc;stroke:#475569;stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}.line{fill:none;stroke:#475569;stroke-width:3}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.box{fill:#1e293b;stroke:#cbd5e1}.blue{fill:#172554;stroke:#60a5fa}.red{fill:#450a0a;stroke:#f87171}.green{fill:#052e16;stroke:#4ade80}.line,.dash{stroke:#cbd5e1}}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect class="box" x="30" y="92" width="260" height="236" rx="24"/><text class="title" x="160" y="145" text-anchor="middle">Λ², dim = 6</text><text class="small" x="160" y="195" text-anchor="middle">e¹², e¹³, e¹⁴</text><text class="small" x="160" y="225" text-anchor="middle">e³⁴, e²⁴, e²³</text><path class="line" d="M300 180 C360 180 370 118 430 118" marker-end="url(#a)"/><path class="line" d="M300 240 C360 240 370 302 430 302" marker-end="url(#a)"/><rect class="blue" x="440" y="38" width="440" height="150" rx="24"/><text class="title" x="660" y="82" text-anchor="middle">Λ²₊</text><text class="label" x="660" y="118" text-anchor="middle">*ω = +ω, dim = 3</text><text class="small" x="660" y="153" text-anchor="middle">e¹²+e³⁴, e¹³-e²⁴, e¹⁴+e²³</text><rect class="red" x="440" y="232" width="440" height="150" rx="24"/><text class="title" x="660" y="276" text-anchor="middle">Λ²₋</text><text class="label" x="660" y="312" text-anchor="middle">*ω = -ω, dim = 3</text><text class="small" x="660" y="347" text-anchor="middle">e¹²-e³⁴, e¹³+e²⁴, e¹⁴-e²³</text></svg>