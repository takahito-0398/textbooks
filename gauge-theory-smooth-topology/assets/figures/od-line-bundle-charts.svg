<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-labelledby="title desc"><title id="title">O(d)の貼り合わせ</title><desc id="desc">CP1の二つのチャートでフレームと局所関数が逆の遷移式で貼り合うことを示す。</desc><style>
text{font-family:system-ui,sans-serif;fill:#172033}.box{fill:#f8fafc;stroke:#475569;stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}.amber{fill:#fef3c7;stroke:#d97706;stroke-width:2.5}.line{fill:none;stroke:#475569;stroke-width:3}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}.math{font-size:20px;font-weight:650}@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.box{fill:#1e293b;stroke:#cbd5e1}.blue{fill:#172554;stroke:#60a5fa}.green{fill:#052e16;stroke:#4ade80}.amber{fill:#451a03;stroke:#fbbf24}.line,.dash{stroke:#cbd5e1}}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<text class="title" x="490" y="42" text-anchor="middle">CP¹上の O(d)：フレームと局所関数は逆向きに変換する</text>
<rect class="blue" x="70" y="85" width="285" height="145" rx="18"/><text class="label" x="212" y="125" text-anchor="middle">U₀: z=z₁/z₀</text><text class="math" x="212" y="168" text-anchor="middle">s = s₀(z)e₀</text><text class="small" x="212" y="200" text-anchor="middle">例: s₀(z)=P(1,z)</text>
<rect class="green" x="625" y="85" width="285" height="145" rx="18"/><text class="label" x="768" y="125" text-anchor="middle">U₁: w=z₀/z₁=1/z</text><text class="math" x="768" y="168" text-anchor="middle">s = s₁(w)e₁</text><text class="small" x="768" y="200" text-anchor="middle">例: s₁(w)=P(w,1)</text>
<path class="line" d="M365 145 C455 100 535 100 615 145" marker-end="url(#a)"/><path class="line" d="M615 182 C525 230 445 230 365 182" marker-end="url(#a)"/>
<rect class="amber" x="310" y="270" width="360" height="120" rx="18"/><text class="label" x="490" y="308" text-anchor="middle">重なり U₀∩U₁</text><text class="math" x="490" y="346" text-anchor="middle">e₁ = zᵈ e₀</text><text class="math" x="490" y="378" text-anchor="middle">s₁ = z⁻ᵈ s₀</text>
<path class="dash" d="M245 235 C315 280 335 295 372 315"/><path class="dash" d="M735 235 C665 280 645 295 608 315"/>
<text class="small" x="490" y="435" text-anchor="middle">次数dの同次多項式はこの貼り合わせ条件を満たし、零点の総数は重複度込みでdになる。</text>
</svg>
