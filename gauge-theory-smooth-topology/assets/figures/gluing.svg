<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="title desc"><title id="title">Gluing near a compactification stratum</title><desc id="desc">Boundary data are glued to approximate solutions and corrected to genuine solutions.</desc><style>
text{font-family:system-ui,sans-serif;fill:#172033}.box{fill:#f8fafc;stroke:#475569;stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}.line{fill:none;stroke:#475569;stroke-width:3}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.box{fill:#1e293b;stroke:#cbd5e1}.blue{fill:#172554;stroke:#60a5fa}.red{fill:#450a0a;stroke:#f87171}.green{fill:#052e16;stroke:#4ade80}.line,.dash{stroke:#cbd5e1}}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect class="blue" x="45" y="75" width="230" height="125" rx="22"/><text class="title" x="160" y="118" text-anchor="middle">boundary data</text><text class="small" x="160" y="151" text-anchor="middle">background + bubble</text><rect class="red" x="375" y="75" width="230" height="125" rx="22"/><text class="title" x="490" y="118" text-anchor="middle">approximate</text><text class="small" x="490" y="151" text-anchor="middle">cutoff and scale ρ</text><rect class="green" x="705" y="75" width="230" height="125" rx="22"/><text class="title" x="820" y="118" text-anchor="middle">true solution</text><text class="small" x="820" y="151" text-anchor="middle">right inverse correction</text><path class="line" d="M280 138 H365" marker-end="url(#a)"/><path class="line" d="M610 138 H695" marker-end="url(#a)"/><rect class="box" x="230" y="290" width="520" height="105" rx="24"/><text class="label" x="490" y="330" text-anchor="middle">compactness records limits</text><text class="label" x="490" y="363" text-anchor="middle">gluing proves they are actual ends</text></svg>