<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="title desc"><title id="title">Cut-down moduli and cobordism</title><desc id="desc">Cohomology constraints cut a positive-dimensional moduli space to signed points, and a one-parameter moduli space proves invariance.</desc><style>
text{font-family:system-ui,sans-serif;fill:#172033}.box{fill:#f8fafc;stroke:#475569;stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}.line{fill:none;stroke:#475569;stroke-width:3}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.box{fill:#1e293b;stroke:#cbd5e1}.blue{fill:#172554;stroke:#60a5fa}.red{fill:#450a0a;stroke:#f87171}.green{fill:#052e16;stroke:#4ade80}.line,.dash{stroke:#cbd5e1}}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect class="blue" x="55" y="55" width="260" height="130" rx="24"/><text class="title" x="185" y="99" text-anchor="middle">moduli M</text><text class="small" x="185" y="132" text-anchor="middle">positive dimension</text><path class="dash" d="M105 155 C160 105 245 105 295 155"/><rect class="red" x="365" y="55" width="250" height="130" rx="24"/><text class="title" x="490" y="99" text-anchor="middle">μ-conditions</text><text class="small" x="490" y="132" text-anchor="middle">cycles Vα intersect M</text><rect class="green" x="675" y="55" width="250" height="130" rx="24"/><text class="title" x="800" y="99" text-anchor="middle">signed points</text><text class="small" x="800" y="132" text-anchor="middle">0-dimensional count</text><circle cx="760" cy="155" r="7" fill="#16a34a"/><circle cx="805" cy="130" r="7" fill="#dc2626"/><circle cx="845" cy="158" r="7" fill="#16a34a"/><path class="line" d="M320 120 H355" marker-end="url(#a)"/><path class="line" d="M620 120 H665" marker-end="url(#a)"/><rect class="box" x="150" y="285" width="680" height="135" rx="28"/><text class="title" x="490" y="330" text-anchor="middle">one-parameter cobordism</text><text class="label" x="490" y="368" text-anchor="middle">boundary = count at g₁ - count at g₀</text><text class="small" x="490" y="397" text-anchor="middle">no reducible or bubbling boundary ⇒ invariant</text><path class="line" d="M800 195 C790 255 695 290 620 315" marker-end="url(#a)"/><text class="small" x="490" y="470" text-anchor="middle">PDE solutions become topology only after regularity, orientation, compactness, and cobordism</text></svg>