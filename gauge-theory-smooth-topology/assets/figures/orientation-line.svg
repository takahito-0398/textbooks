<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="title desc"><title id="title">Determinant line orientation</title><desc id="desc">Kernel and cokernel of a Fredholm operator determine an orientation line for moduli counting.</desc><style>
text{font-family:system-ui,sans-serif;fill:#172033}.box{fill:#f8fafc;stroke:#475569;stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}.line{fill:none;stroke:#475569;stroke-width:3}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.box{fill:#1e293b;stroke:#cbd5e1}.blue{fill:#172554;stroke:#60a5fa}.red{fill:#450a0a;stroke:#f87171}.green{fill:#052e16;stroke:#4ade80}.line,.dash{stroke:#cbd5e1}}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect class="blue" x="55" y="70" width="250" height="120" rx="22"/><text class="title" x="180" y="113" text-anchor="middle">ker D_A</text><text class="small" x="180" y="146" text-anchor="middle">infinitesimal solutions</text><rect class="red" x="675" y="70" width="250" height="120" rx="22"/><text class="title" x="800" y="113" text-anchor="middle">coker D_A</text><text class="small" x="800" y="146" text-anchor="middle">obstructions</text><rect class="green" x="245" y="265" width="490" height="125" rx="28"/><text class="title" x="490" y="310" text-anchor="middle">det D_A</text><text class="label" x="490" y="348" text-anchor="middle">Λmax ker D_A ⊗ (Λmax coker D_A)*</text><path class="line" d="M190 200 C250 250 305 275 360 305" marker-end="url(#a)"/><path class="line" d="M790 200 C730 250 675 275 620 305" marker-end="url(#a)"/><text class="small" x="490" y="438" text-anchor="middle">orientation of this line gives signs in zero-dimensional counts</text></svg>