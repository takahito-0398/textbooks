<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">座標近傍の重なりと座標変換</title><desc id="desc">同じ点集合を二つの座標で表し、重なり上の座標変換を示す。</desc><style>
text{font-family:system-ui,sans-serif;fill:#172033}.box{fill:#f8fafc;stroke:#475569;stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}.line{fill:none;stroke:#475569;stroke-width:3}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.box{fill:#1e293b;stroke:#cbd5e1}.blue{fill:#172554;stroke:#60a5fa}.red{fill:#450a0a;stroke:#f87171}.green{fill:#052e16;stroke:#4ade80}.line,.dash{stroke:#cbd5e1}}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><ellipse class="blue" cx="230" cy="200" rx="150" ry="105"/><ellipse class="red" cx="390" cy="200" rx="150" ry="105"/><text class="title" x="170" y="120">U</text><text class="title" x="445" y="120">W</text><text class="label" x="310" y="205" text-anchor="middle">U ∩ W</text><rect class="box" x="80" y="350" width="250" height="85" rx="18"/><rect class="box" x="630" y="350" width="250" height="85" rx="18"/><text class="label" x="205" y="400" text-anchor="middle">φ(U ∩ W) ⊂ Rⁿ</text><text class="label" x="755" y="400" text-anchor="middle">ψ(U ∩ W) ⊂ Rⁿ</text><path class="line" d="M235 310 L210 342" marker-end="url(#a)"/><path class="line" d="M390 305 C500 315 600 330 690 350" marker-end="url(#a)"/><path class="line" d="M340 390 H615" marker-end="url(#a)"/><text class="small" x="478" y="375" text-anchor="middle">ψ ∘ φ⁻¹（座標変換）</text></svg>