<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">チェイン・境界・サイクル</title><desc id="desc">向き付き三角形の境界を取り、さらに境界を取ると頂点が相殺する。</desc><style>
text{font-family:system-ui,sans-serif;fill:#172033}.box{fill:#f8fafc;stroke:#475569;stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}.line{fill:none;stroke:#475569;stroke-width:3}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.box{fill:#1e293b;stroke:#cbd5e1}.blue{fill:#172554;stroke:#60a5fa}.red{fill:#450a0a;stroke:#f87171}.green{fill:#052e16;stroke:#4ade80}.line,.dash{stroke:#cbd5e1}}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><path class="blue" d="M110 340 L265 80 L420 340 Z"/><text class="label" x="265" y="215" text-anchor="middle">2-チェイン c</text><path class="line" d="M445 210 H535" marker-end="url(#a)"/><text class="label" x="490" y="190" text-anchor="middle">∂</text><path d="M590 340 L745 80 L900 340 Z" fill="none" stroke="#2563eb" stroke-width="7"/><text class="label" x="745" y="215" text-anchor="middle">境界 ∂c</text><text class="small" x="745" y="385" text-anchor="middle">閉じた1-サイクル：∂(∂c)=0</text><circle cx="590" cy="340" r="7" fill="#dc2626"/><circle cx="745" cy="80" r="7" fill="#dc2626"/><circle cx="900" cy="340" r="7" fill="#dc2626"/></svg>