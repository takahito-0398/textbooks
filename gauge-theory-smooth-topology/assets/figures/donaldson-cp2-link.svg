<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">Donaldson diagonalization link comparison</title>
<desc id="desc">Comparison between the CP1 toy link and the CP2 reducible link in the five dimensional ASD moduli space.</desc>
<style>
text{font-family:system-ui,"Yu Gothic",sans-serif;fill:#172033}
.title{font-size:27px;font-weight:700}
.head{font-size:20px;font-weight:700}
.label{font-size:17px;font-weight:600}
.small{font-size:14px}
.box{fill:#f8fafc;stroke:#334155;stroke-width:2.5}
.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}
.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}
.red{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5}
.amber{fill:#fef3c7;stroke:#d97706;stroke-width:2.5}
.line{fill:none;stroke:#475569;stroke-width:3}
.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7}
@media(prefers-color-scheme:dark){
text{fill:#f1f5f9}.box{fill:#1e293b;stroke:#cbd5e1}.blue{fill:#172554;stroke:#60a5fa}.green{fill:#052e16;stroke:#4ade80}.red{fill:#450a0a;stroke:#f87171}.amber{fill:#422006;stroke:#fbbf24}.line,.dash{stroke:#cbd5e1}
}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<text class="title" x="560" y="44" text-anchor="middle">可約リンクの次元を取り違えない</text>

<rect class="blue" x="60" y="86" width="450" height="210" rx="10"/>
<text class="head" x="285" y="126" text-anchor="middle">練習模型</text>
<text class="label" x="285" y="166" text-anchor="middle">C^2 / S^1 の原点リンク</text>
<text class="small" x="285" y="202" text-anchor="middle">S^3 / S^1 = CP^1</text>
<text class="small" x="285" y="232" text-anchor="middle">実次元 2、評価は ∫CP1 h = 1</text>
<text class="small" x="285" y="262" text-anchor="middle">局所特異点の読み方だけを練習する</text>

<rect class="green" x="610" y="86" width="450" height="210" rx="10"/>
<text class="head" x="835" y="126" text-anchor="middle">Donaldson本論</text>
<text class="label" x="835" y="166" text-anchor="middle">5次元ASDモジュライの可約点</text>
<text class="small" x="835" y="202" text-anchor="middle">C^3 / S^1 のリンク S^5 / S^1 = CP^2</text>
<text class="small" x="835" y="232" text-anchor="middle">実次元 4、評価は ∫CP2 h^2 = 1</text>
<text class="small" x="835" y="262" text-anchor="middle">c2=1 から c1(L)^2 = -1 が出る</text>

<path class="dash" d="M510 191 H610" marker-end="url(#arrow)"/>
<text class="small" x="560" y="176" text-anchor="middle">次元を上げる</text>

<rect class="amber" x="140" y="370" width="320" height="150" rx="10"/>
<text class="head" x="300" y="410" text-anchor="middle">バブリング端</text>
<text class="label" x="300" y="450" text-anchor="middle">X</text>
<text class="small" x="300" y="486" text-anchor="middle">1単位のエネルギー集中の中心</text>

<rect class="red" x="660" y="370" width="320" height="150" rx="10"/>
<text class="head" x="820" y="410" text-anchor="middle">可約リンクの和</text>
<text class="label" x="820" y="450" text-anchor="middle">±CP^2 が N 個</text>
<text class="small" x="820" y="486" text-anchor="middle">N = #{±c : c^2 = -1}</text>

<path class="line" d="M460 445 C545 350 575 350 660 445" marker-end="url(#arrow)"/>
<text class="label" x="560" y="360" text-anchor="middle">5次元コボルディズムの境界</text>
<text class="label" x="560" y="580" text-anchor="middle">σ(X)=Σ εj なので r=|σ(X)|≤N、格子補題で N≤r</text>
</svg>
