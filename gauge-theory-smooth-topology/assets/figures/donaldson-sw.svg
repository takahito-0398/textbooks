<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="title desc"><title id="title">Donaldson and Seiberg-Witten comparison</title><desc id="desc">Different equations enter a common moduli-space lifecycle.</desc><style>
text{font-family:system-ui,sans-serif;fill:#172033}.box{fill:#f8fafc;stroke:#475569;stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}.line{fill:none;stroke:#475569;stroke-width:3}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.box{fill:#1e293b;stroke:#cbd5e1}.blue{fill:#172554;stroke:#60a5fa}.red{fill:#450a0a;stroke:#f87171}.green{fill:#052e16;stroke:#4ade80}.line,.dash{stroke:#cbd5e1}}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect class="blue" x="35" y="55" width="260" height="105" rx="20"/><text class="title" x="165" y="95" text-anchor="middle">Donaldson</text><text class="small" x="165" y="128" text-anchor="middle">SU(2) connection, F⁺=0</text><rect class="red" x="685" y="55" width="260" height="105" rx="20"/><text class="title" x="815" y="95" text-anchor="middle">Seiberg-Witten</text><text class="small" x="815" y="128" text-anchor="middle">U(1) connection + spinor</text><rect class="green" x="255" y="225" width="470" height="180" rx="28"/><text class="title" x="490" y="265" text-anchor="middle">Common moduli lifecycle</text><text class="label" x="490" y="305" text-anchor="middle">symmetry → linearization → elliptic complex</text><text class="label" x="490" y="340" text-anchor="middle">index → regularity → orientation</text><text class="label" x="490" y="375" text-anchor="middle">compactness → count</text><path class="line" d="M165 170 C165 230 235 250 265 270" marker-end="url(#a)"/><path class="line" d="M815 170 C815 230 745 250 715 270" marker-end="url(#a)"/><text class="small" x="165" y="455" text-anchor="middle">bubbling / polynomials</text><text class="small" x="815" y="455" text-anchor="middle">bounds / basic classes</text></svg>