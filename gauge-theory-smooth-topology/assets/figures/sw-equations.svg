<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-labelledby="title desc"><title id="title">Seiberg-Witten equations</title><desc id="desc">A U(1) connection and a positive spinor are coupled by the Dirac equation and the curvature equation.</desc><style>
text{font-family:system-ui,sans-serif;fill:#172033}.box{fill:#f8fafc;stroke:#475569;stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}.line{fill:none;stroke:#475569;stroke-width:3}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.box{fill:#1e293b;stroke:#cbd5e1}.blue{fill:#172554;stroke:#60a5fa}.red{fill:#450a0a;stroke:#f87171}.green{fill:#052e16;stroke:#4ade80}.line,.dash{stroke:#cbd5e1}}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect class="blue" x="55" y="70" width="255" height="115" rx="22"/><text class="title" x="182" y="113" text-anchor="middle">connection A</text><text class="small" x="182" y="145" text-anchor="middle">curvature F⁺A</text><rect class="red" x="670" y="70" width="255" height="115" rx="22"/><text class="title" x="798" y="113" text-anchor="middle">spinor Φ</text><text class="small" x="798" y="145" text-anchor="middle">quadratic q(Φ)</text><rect class="green" x="310" y="245" width="360" height="135" rx="26"/><text class="title" x="490" y="292" text-anchor="middle">SW moduli problem</text><text class="label" x="490" y="330" text-anchor="middle">D_A Φ = 0</text><text class="label" x="490" y="360" text-anchor="middle">F⁺A = q(Φ) + iη</text><path class="line" d="M250 190 C300 235 335 255 370 285" marker-end="url(#a)"/><path class="line" d="M730 190 C680 235 645 255 610 285" marker-end="url(#a)"/><path class="dash" d="M310 128 H670"/><text class="small" x="490" y="112" text-anchor="middle">Dirac operator depends on A</text><text class="small" x="490" y="425" text-anchor="middle">abelian connection, but nonlinear coupled equations</text></svg>