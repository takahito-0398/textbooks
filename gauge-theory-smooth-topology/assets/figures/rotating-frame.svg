<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">回転する基底と固定ベクトル</title><desc id="desc">固定ベクトルを回転基底で表すと成分が変化し、接続項が基底の回転を補正する。</desc><style>
text{font-family:system-ui,sans-serif;fill:#172033}.box{fill:#f8fafc;stroke:#475569;stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}.line{fill:none;stroke:#475569;stroke-width:3}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.box{fill:#1e293b;stroke:#cbd5e1}.blue{fill:#172554;stroke:#60a5fa}.red{fill:#450a0a;stroke:#f87171}.green{fill:#052e16;stroke:#4ade80}.line,.dash{stroke:#cbd5e1}}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><path class="line" d="M100 360 H860 M220 420 V60"/><path d="M220 360 L700 360" stroke="#16a34a" stroke-width="7" marker-end="url(#a)"/><text class="label" x="705" y="340">固定ベクトル v</text><path d="M220 360 L525 150" stroke="#2563eb" stroke-width="6" marker-end="url(#a)"/><path d="M220 360 L430 425" stroke="#dc2626" stroke-width="6" marker-end="url(#a)"/><text class="label" x="525" y="130">e₁(t)</text><text class="label" x="440" y="450">e₂(t)</text><path class="dash" d="M355 360 A135 135 0 0 0 330 282"/><text class="small" x="380" y="295">基底だけが回転</text><rect class="box" x="575" y="70" width="310" height="125" rx="20"/><text class="label" x="730" y="115" text-anchor="middle">v = R(t)a(t)</text><text class="small" x="730" y="155" text-anchor="middle">a′ + R⁻¹R′a = 0</text></svg>