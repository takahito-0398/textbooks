<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">スピノルの2π回転と4π回転</title><desc id="desc">普通のベクトルは2π回転で戻るが、スピノルは符号が反転し4π回転で元に戻る。</desc><style>
text{font-family:system-ui,sans-serif;fill:#172033}.box{fill:#f8fafc;stroke:#475569;stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}.line{fill:none;stroke:#475569;stroke-width:3}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.box{fill:#1e293b;stroke:#cbd5e1}.blue{fill:#172554;stroke:#60a5fa}.red{fill:#450a0a;stroke:#f87171}.green{fill:#052e16;stroke:#4ade80}.line,.dash{stroke:#cbd5e1}}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect class="blue" x="55" y="75" width="250" height="130" rx="24"/><text class="title" x="180" y="120" text-anchor="middle">開始</text><text class="label" x="180" y="165" text-anchor="middle">ψ</text><rect class="red" x="355" y="75" width="250" height="130" rx="24"/><text class="title" x="480" y="120" text-anchor="middle">2π 回転</text><text class="label" x="480" y="165" text-anchor="middle">−ψ</text><rect class="green" x="655" y="75" width="250" height="130" rx="24"/><text class="title" x="780" y="120" text-anchor="middle">4π 回転</text><text class="label" x="780" y="165" text-anchor="middle">ψ</text><path class="line" d="M315 140 H345" marker-end="url(#a)"/><path class="line" d="M615 140 H645" marker-end="url(#a)"/><path class="dash" d="M180 300 H780"/><text class="label" x="480" y="340" text-anchor="middle">Spin(3) → SO(3) は2対1</text><text class="small" x="480" y="385" text-anchor="middle">2π回転はSpin側では閉じず、4πで初めて戻る</text></svg>