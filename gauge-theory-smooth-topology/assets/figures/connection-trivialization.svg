<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="title desc"><title id="title">接続と局所自明化</title><desc id="desc">局所枠を替えると微分に余分な項が生じ、接続1形式がそれを補正する。</desc><style>
text{font-family:system-ui,sans-serif;fill:#172033}.box{fill:#f8fafc;stroke:#475569;stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}.line{fill:none;stroke:#475569;stroke-width:3}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.box{fill:#1e293b;stroke:#cbd5e1}.blue{fill:#172554;stroke:#60a5fa}.red{fill:#450a0a;stroke:#f87171}.green{fill:#052e16;stroke:#4ade80}.line,.dash{stroke:#cbd5e1}}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect class="blue" x="55" y="70" width="260" height="115" rx="22"/><text class="title" x="185" y="112" text-anchor="middle">局所枠 e</text><text class="small" x="185" y="145" text-anchor="middle">切断 s と微分 ds</text><rect class="red" x="665" y="70" width="260" height="115" rx="22"/><text class="title" x="795" y="112" text-anchor="middle">局所枠 eg</text><text class="small" x="795" y="145" text-anchor="middle">dg から生じる余分な項</text><path class="line" d="M322 128 H655" marker-end="url(#a)"/><text class="small" x="490" y="112" text-anchor="middle">g で局所自明化を変更</text><rect class="green" x="250" y="280" width="480" height="120" rx="28"/><text class="title" x="490" y="322" text-anchor="middle">共変微分 d_A</text><text class="label" x="490" y="358" text-anchor="middle">A が変換して dg を相殺</text><path class="line" d="M185 195 C250 255 315 285 380 312" marker-end="url(#a)"/><path class="line" d="M795 195 C730 255 665 285 600 312" marker-end="url(#a)"/><text class="small" x="490" y="445" text-anchor="middle">接続は枠の動きでなく幾何学的な変化を測る</text></svg>