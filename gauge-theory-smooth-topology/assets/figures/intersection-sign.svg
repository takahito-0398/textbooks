<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">曲面の交点の符号</title><desc id="desc">二つの向き付き接平面を並べた向きが4次元多様体の向きと一致するかで交点符号を定める。</desc><style>
text{font-family:system-ui,sans-serif;fill:#172033}.box{fill:#f8fafc;stroke:#475569;stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}.line{fill:none;stroke:#475569;stroke-width:3}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.box{fill:#1e293b;stroke:#cbd5e1}.blue{fill:#172554;stroke:#60a5fa}.red{fill:#450a0a;stroke:#f87171}.green{fill:#052e16;stroke:#4ade80}.line,.dash{stroke:#cbd5e1}}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><path class="blue" d="M85 300 C220 120 390 120 520 300 C390 390 220 390 85 300 Z"/><path class="red" d="M290 70 C430 150 500 300 405 430 C270 350 205 205 290 70 Z"/><circle cx="315" cy="270" r="10" fill="#172033"/><text class="label" x="145" y="185">Σ₁ の向き</text><text class="label" x="430" y="115">Σ₂ の向き</text><path class="line" d="M550 260 H650" marker-end="url(#a)"/><rect class="green" x="670" y="170" width="235" height="190" rx="24"/><text class="title" x="787" y="220" text-anchor="middle">交点符号</text><text class="label" x="787" y="270" text-anchor="middle">向きが一致：+1</text><text class="label" x="787" y="310" text-anchor="middle">向きが反対：−1</text></svg>