<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">位相・PL・滑らかな圏</title><desc id="desc">滑らかにできるかという存在問題と、滑らかな構造の一意性を区別する。</desc><style>
text{font-family:system-ui,sans-serif;fill:#172033}.box{fill:#f8fafc;stroke:#475569;stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2.5}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}.line{fill:none;stroke:#475569;stroke-width:3}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}@media(prefers-color-scheme:dark){text{fill:#f1f5f9}.box{fill:#1e293b;stroke:#cbd5e1}.blue{fill:#172554;stroke:#60a5fa}.red{fill:#450a0a;stroke:#f87171}.green{fill:#052e16;stroke:#4ade80}.line,.dash{stroke:#cbd5e1}}</style><rect class="blue" x="55" y="42" width="790" height="330" rx="30"/><text class="title" x="450" y="82" text-anchor="middle">位相的4次元多様体</text><rect class="green" x="150" y="112" width="600" height="210" rx="26"/><text class="title" x="450" y="152" text-anchor="middle">滑らかにできる</text><rect class="box" x="245" y="182" width="410" height="90" rx="22"/><text class="title" x="450" y="220" text-anchor="middle">選んだ一つの滑らかな構造</text><text class="small" x="450" y="250" text-anchor="middle">微分同相不変量で比較</text><text class="small" x="450" y="350" text-anchor="middle">緑の外側：平滑化不能　複数の選択：エキゾチック</text></svg>