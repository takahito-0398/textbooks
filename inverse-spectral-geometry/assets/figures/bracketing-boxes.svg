    </g>
    <g fill="#fde68a">
      <rect x="150" y="130" width="60" height="60"/><rect x="150" y="190" width="60" height="60"/><rect x="150" y="250" width="60" height="60"/>
      <rect x="210" y="70" width="60" height="60"/><rect x="270" y="70" width="60" height="60"/><rect x="330" y="70" width="60" height="60"/><rect x="390" y="70" width="60" height="60"/><rect x="450" y="70" width="60" height="60"/><rect x="510" y="70" width="60" height="60"/><rect x="570" y="70" width="60" height="60"/><rect x="630" y="130" width="60" height="60"/><rect x="690" y="190" width="60" height="60"/>
