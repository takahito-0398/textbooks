<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="t d"><title id="t">Dirichlet符号付きtransplantation行列</title><desc id="d">正の係数を青、負の係数を赤で示す7×7行列TD</desc><rect width="920" height="430" fill="white"/><text x="460" y="35" font-family="sans-serif" font-size="23" text-anchor="middle">T_D = D T D　（青 +1／赤 −1）</text><g transform="translate(245 70)" stroke="#94a3b8"><rect width="385" height="294" fill="white"/><path d="M55 0V294M110 0V294M165 0V294M220 0V294M275 0V294M330 0V294M0 42H385M0 84H385M0 126H385M0 168H385M0 210H385M0 252H385"/><g fill="#dc2626"><rect x="55" y="0" width="55" height="42"/><rect x="110" y="0" width="55" height="42"/><rect x="220" y="0" width="55" height="42"/><rect x="0" y="42" width="55" height="42"/><rect x="165" y="42" width="55" height="42"/><rect x="0" y="84" width="55" height="42"/><rect x="330" y="84" width="55" height="42"/><rect x="55" y="126" width="55" height="42"/><rect x="0" y="168" width="55" height="42"/><rect x="275" y="168" width="55" height="42"/><rect x="220" y="210" width="55" height="42"/><rect x="110" y="252" width="55" height="42"/></g><g fill="#2563eb"><rect x="55" y="42" width="55" height="42"/><rect x="110" y="84" width="55" height="42"/><rect x="275" y="126" width="55" height="42"/><rect x="330" y="126" width="55" height="42"/><rect x="220" y="168" width="55" height="42"/><rect x="165" y="210" width="55" height="42"/><rect x="330" y="210" width="55" height="42"/><rect x="165" y="252" width="55" height="42"/><rect x="275" y="252" width="55" height="42"/></g></g><g font-family="sans-serif" font-size="18" fill="#0f172a"><text x="55" y="160">D = diag(1,−1,−1,1,−1,1,1)</text><text x="675" y="175">det T_D = −24</text><text x="675" y="215">外部辺は奇反射</text><text x="675" y="250">固定点の符号は −1</text></g></svg>
