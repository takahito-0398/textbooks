<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" role="img" aria-labelledby="t d"><title id="t">Sunada法の被覆と不変関数</title><desc id="d">共通被覆M上のH1とH2の軌道を商へつぶし、不変固有関数を対応させる</desc><rect width="880" height="410" fill="white"/><ellipse cx="440" cy="95" rx="245" ry="62" fill="#dbeafe" stroke="#0f172a" stroke-width="3"/><g fill="#2563eb"><circle cx="300" cy="83" r="8"/><circle cx="350" cy="120" r="8"/><circle cx="415" cy="72" r="8"/></g><g fill="#dc2626"><circle cx="475" cy="118" r="8"/><circle cx="540" cy="75" r="8"/><circle cx="590" cy="112" r="8"/></g><path d="M320 155L230 280M560 155L650 280" stroke="#0f172a" stroke-width="3" marker-end="url(#a)"/><ellipse cx="220" cy="320" rx="140" ry="50" fill="#dcfce7" stroke="#0f172a" stroke-width="3"/><ellipse cx="660" cy="320" rx="140" ry="50" fill="#fee2e2" stroke="#0f172a" stroke-width="3"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#0f172a"/></marker></defs><g font-family="sans-serif" text-anchor="middle" fill="#0f172a"><text x="440" y="102" font-size="23">共通被覆 M：G が等長作用</text><text x="220" y="315" font-size="22">H₁\M</text><text x="220" y="343" font-size="17">H₁-軌道を一点へ</text><text x="660" y="315" font-size="22">H₂\M</text><text x="660" y="343" font-size="17">H₂-軌道を一点へ</text><text x="440" y="220" font-size="18">商の固有関数 ↔ M上のHᵢ-不変固有関数</text></g></svg>
