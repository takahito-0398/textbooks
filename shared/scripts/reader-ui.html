<script>
(function () {
  const main = document.querySelector("main.content");
  if (!main) return;

  const clean = (value) => (value || "").replace(/\s+/g, " ").trim();
  const escapeHtml = (value) => clean(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
  const escapeAttr = (value) => escapeHtml(value).replace(/'/g, "&#39;");
  const headingId = (heading) => (
    heading.id ||
    heading.dataset.anchorId ||
    heading.closest("section[id]")?.id ||
    ""
  );
  const sidebarLinks = Array.from(document.querySelectorAll("#quarto-sidebar a.sidebar-link"));
  const activeSidebarIndex = sidebarLinks.findIndex((link) => link.classList.contains("active"));

  // The portal home is a catalogue, not a reading surface. Reader chrome there
  // duplicates the title and creates meaningless previous/next controls.
  if (activeSidebarIndex < 0) return;

  document.body.classList.add("reader-ui");

  const chapterTitle = clean(main.querySelector("h1")?.textContent || document.title.replace(/–.*$/, ""));
  const headings = Array.from(main.querySelectorAll("h1, h2, h3")).filter((heading) => headingId(heading));
  const sectionHeadings = headings.filter((heading) => heading.tagName !== "H1");
  const bookTitle = clean(
    document.querySelector("#quarto-sidebar .sidebar-title")?.textContent ||
    sidebarLinks[0]?.textContent ||
    "教材"
  );
  const prevSidebarLink = activeSidebarIndex > 0 ? sidebarLinks[activeSidebarIndex - 1] : null;
  const nextSidebarLink = activeSidebarIndex < sidebarLinks.length - 1 ? sidebarLinks[activeSidebarIndex + 1] : null;
  const portalHref = document.querySelector(".navbar-brand")?.getAttribute("href") || "/";
  const existingPrev = document.querySelector('link[rel="prev"]')?.getAttribute("href");
  const existingNext = document.querySelector('link[rel="next"]')?.getAttribute("href");
  const isBookLanding = activeSidebarIndex === 0;
  const prevHref = existingPrev || prevSidebarLink?.getAttribute("href") || (isBookLanding ? portalHref : null);
  const nextHref = existingNext || nextSidebarLink?.getAttribute("href") || null;
  const prevLabel = clean(
    prevSidebarLink?.textContent ||
    document.querySelector(".nav-page-previous .nav-page-text")?.textContent ||
    (isBookLanding ? "教材一覧" : "")
  );
  const nextLabel = clean(
    nextSidebarLink?.textContent ||
    document.querySelector(".nav-page-next .nav-page-text")?.textContent ||
    ""
  );

  const progress = document.createElement("div");
  progress.className = "reader-progress";
  progress.innerHTML = '<div class="reader-progress__bar" aria-hidden="true"></div>';
  document.body.appendChild(progress);

  const mobileStatus = document.createElement("aside");
  mobileStatus.className = "reader-mobile-status";
  mobileStatus.setAttribute("aria-label", "現在位置");
  mobileStatus.innerHTML = `
    <div class="reader-mobile-status__section">
      <span class="reader-current-section"></span>
      <span class="reader-mobile-status__percent">0%</span>
    </div>
    <div class="reader-mobile-status__meter" aria-hidden="true"><span></span></div>
  `;
  document.body.insertBefore(mobileStatus, document.getElementById("quarto-content") || main);

  const edgeControl = (direction, href, label) => {
    const className = `reader-bottom-nav__${direction}`;
    const arrow = direction === "prev" ? "←" : "→";
    const accessibleName = direction === "prev" ? "前の章" : "次の章";
    if (!href) {
      return `<span class="${className} is-disabled" aria-disabled="true"><span aria-hidden="true">${arrow}</span><strong>${accessibleName}</strong></span>`;
    }
    return `<a class="${className}" href="${href}" aria-label="${accessibleName}: ${label}"><span aria-hidden="true">${arrow}</span><strong>${label}</strong></a>`;
  };

  const rail = document.createElement("aside");
  rail.className = "reader-rail";
  rail.setAttribute("aria-label", "読書位置");
  rail.innerHTML = `
    <div class="reader-rail__label">現在</div>
    <div class="reader-rail__chapter">${chapterTitle}</div>
    <div class="reader-rail__section reader-current-section"></div>
    <div class="reader-rail__meter" aria-hidden="true"><span></span></div>
    <div class="reader-rail__percent">0%</div>
    <div class="reader-rail__links">
      ${prevHref ? `<a href="${prevHref}"><span>前の章</span>${prevLabel}</a>` : ""}
      ${nextHref ? `<a href="${nextHref}"><span>次の章</span>${nextLabel}</a>` : ""}
    </div>
  `;
  document.body.appendChild(rail);

  const tocButtonId = "reader-toc-button";
  const bottomNav = document.createElement("nav");
  bottomNav.className = "reader-bottom-nav";
  bottomNav.setAttribute("aria-label", "読書ナビゲーション");
  bottomNav.innerHTML = `
    ${edgeControl("prev", prevHref, prevLabel)}
    <button id="${tocButtonId}" class="reader-bottom-nav__toc" type="button" aria-haspopup="dialog" aria-expanded="false">目次</button>
    ${edgeControl("next", nextHref, nextLabel)}
  `;
  document.body.appendChild(bottomNav);

  const backdrop = document.createElement("div");
  backdrop.className = "reader-toc-backdrop";
  document.body.appendChild(backdrop);

  const sheet = document.createElement("section");
  sheet.className = "reader-toc-sheet";
  sheet.setAttribute("role", "dialog");
  sheet.setAttribute("aria-modal", "true");
  sheet.setAttribute("aria-label", "教材全体の目次");
  const tocLinks = sidebarLinks.map((link, index) => {
    const href = link.getAttribute("href");
    const label = clean(link.textContent) || (index === 0 ? "教材トップ" : `章 ${index}`);
    const current = index === activeSidebarIndex;
    if (!href) return "";
    return `<a href="${escapeAttr(href)}" class="${current ? "is-active" : ""}" ${current ? 'aria-current="page"' : ""}>${escapeHtml(label)}</a>`;
  }).join("");
  sheet.innerHTML = `
    <div class="reader-toc-sheet__head">
      <div class="reader-toc-sheet__title">${escapeHtml(bookTitle)} 目次</div>
      <button class="reader-toc-sheet__close" type="button" aria-label="目次を閉じる">閉じる</button>
    </div>
    <div class="reader-toc-sheet__body">${tocLinks || "<p>この教材には目次がありません。</p>"}</div>
  `;
  document.body.appendChild(sheet);

  const currentSectionEls = document.querySelectorAll(".reader-current-section");
  const percentEls = document.querySelectorAll(".reader-mobile-status__percent, .reader-rail__percent");
  const meterEls = document.querySelectorAll(".reader-progress__bar, .reader-mobile-status__meter span, .reader-rail__meter span");
  const tocButton = document.getElementById(tocButtonId);
  const closeButton = sheet.querySelector(".reader-toc-sheet__close");
  let activeHeading = sectionHeadings[0] || headings[0] || null;
  let ticking = false;

  function setActiveHeading(heading) {
    if (!heading) return;
    activeHeading = heading;
    const text = clean(heading.textContent || chapterTitle);
    currentSectionEls.forEach((el) => { el.textContent = text; });
  }

  function updateProgress(scrollTop) {
    const mainTop = main.getBoundingClientRect().top + scrollTop;
    const readableDistance = Math.max(1, main.scrollHeight - window.innerHeight);
    const percent = Math.min(100, Math.max(0, Math.round(((scrollTop - mainTop) / readableDistance) * 100)));
    percentEls.forEach((el) => { el.textContent = `${percent}%`; });
    meterEls.forEach((el) => { el.style.width = `${percent}%`; });
  }

  function updateByScrollPosition() {
    const scrollTop = window.scrollY || document.documentElement.scrollTop;
    const offset = 72;
    let current = sectionHeadings[0] || headings[0] || null;
    for (const heading of sectionHeadings) {
      if (heading.getBoundingClientRect().top <= offset) current = heading;
      else break;
    }
    setActiveHeading(current);
    updateProgress(scrollTop);
    document.body.classList.toggle("reader-reading", scrollTop > 72);
  }

  function requestReaderUpdate() {
    if (ticking) return;
    ticking = true;
    window.requestAnimationFrame(() => {
      updateByScrollPosition();
      ticking = false;
    });
  }

  function openSheet() {
    sheet.classList.add("is-open");
    backdrop.classList.add("is-open");
    document.body.classList.add("reader-toc-open");
    tocButton?.setAttribute("aria-expanded", "true");
    closeButton?.focus({ preventScroll: true });
  }

  function closeSheet({ restoreFocus = true } = {}) {
    sheet.classList.remove("is-open");
    backdrop.classList.remove("is-open");
    document.body.classList.remove("reader-toc-open");
    tocButton?.setAttribute("aria-expanded", "false");
    if (restoreFocus) tocButton?.focus({ preventScroll: true });
  }

  tocButton?.addEventListener("click", openSheet);
  closeButton?.addEventListener("click", () => closeSheet());
  backdrop.addEventListener("click", () => closeSheet());
  document.addEventListener("keydown", (event) => {
    if (!sheet.classList.contains("is-open")) return;
    if (event.key === "Escape") {
      event.preventDefault();
      closeSheet();
      return;
    }
    if (event.key !== "Tab") return;
    const focusable = Array.from(sheet.querySelectorAll("a[href], button:not([disabled])"));
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  });

  sheet.querySelectorAll("a[href^='#']").forEach((link) => link.addEventListener("click", (event) => {
    const target = document.getElementById(decodeURIComponent(link.hash.slice(1)));
    if (!target) return;
    event.preventDefault();
    closeSheet({ restoreFocus: false });
    const behavior = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
    target.scrollIntoView({ behavior, block: "start" });
    history.replaceState(null, "", link.hash);
    target.setAttribute("tabindex", "-1");
    target.focus({ preventScroll: true });
  }));

  window.addEventListener("scroll", requestReaderUpdate, { passive: true });
  window.addEventListener("resize", requestReaderUpdate);
  setActiveHeading(activeHeading);
  updateByScrollPosition();
})();
</script>
